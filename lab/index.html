<style>
  .lab-exp { display: none; }
  .lab-exp.on { display: block; animation: labIn .3s ease; }
  @keyframes labIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .lab-head { display: flex; gap: 16px; align-items: center; }
  .lab-head .big-ico { font-size: 2.6rem; flex: none; width: 64px; height: 64px; display: grid; place-items: center; background: var(--teal-soft); border-radius: 16px; }
  .lab-head h2 { margin: 0; }
  .lab-head p { margin: 2px 0 0; color: var(--muted); font-size: .94rem; }
  .lab-bench { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; border: 1px solid var(--line); }
  .lab-bench > h3 { font-size: 1rem; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .lab-bench > h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft); }
  .lab-think { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 18px; }
  .lab-think h4 { color: var(--purple); margin-bottom: 4px; }
  .lab-intro { background: linear-gradient(120deg, #0b7285, #1098ad 55%, #3bc9db); color: #fff; border-radius: 16px; padding: 18px 22px; margin-bottom: 14px; }
  .lab-intro h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lab-intro p { margin: 0; opacity: .92; font-size: .95rem; }
</style>

<script>
var EXPERIMENTS = [
  {
    id: 'ruler', ch: 1, icon: '📏', title: '用刻度尺测量物体的长度', sub: '读数、估读、多次测量求平均', lesson: '../chapter1/s1-length-time.html#k2',
    goal: '学会正确使用刻度尺测量长度，会估读，会用多次测量求平均值的方法减小误差。',
    apparatus: ['刻度尺（分度值 1 mm / 1 cm）', '橡皮', '回形针', '木块', '铅笔'],
    steps: ['选择被测物体和刻度尺', '拖动刻度尺，使某一刻度线对准物体左端，刻度线紧贴物体', '用放大镜读出左、右两端对准的刻度（估读到分度值的下一位）', '记录数据，移动刻度尺换个起点再测两次', '求出长度的平均值'],
    widgets: ['ruler-lab'],
    think: [['为什么要估读到分度值的下一位？', '估读能让测量结果更接近真实值，最后一位估读值虽然不准确，但仍有意义。'], ['换用分度值 1 cm 的刻度尺，测量结果有什么不同？', '分度值越大，能准确读出的位数越少，测量结果的精确程度越低。']],
  },
  {
    id: 'accumulate', ch: 1, icon: '🧵', title: '累积法测微小长度', sub: '细铜丝的直径 · 一张纸的厚度', lesson: '../chapter1/s1-length-time.html#k3',
    goal: '用“以多测少”的累积法，测出无法直接测量的微小长度。',
    apparatus: ['细铜丝', '铅笔', '刻度尺（分度值 1 mm）', '课本'],
    steps: ['把细铜丝在铅笔上紧密排绕 n 圈（至少 10 圈）', '用刻度尺量出线圈的总长度 L', '计算铜丝直径 d = L / n', '换成“测一张纸的厚度”：注意页数与张数的关系'],
    widgets: ['accumulate-lab'],
    think: [['线圈绕得不紧密，测得的直径偏大还是偏小？', '有间隙时 L 偏大，由 d = L / n 可知测得的直径偏大。'], ['测纸的厚度时，为什么要把纸压紧？', '纸张之间有空气间隙，不压紧会使总厚度偏大，结果偏大。']],
  },
  {
    id: 'stopwatch', ch: 1, icon: '⏱️', title: '停表的使用与时间估测', sub: '操作停表 · 读数练习 · 估测 1 分钟', lesson: '../chapter1/s1-length-time.html#k4',
    goal: '学会使用机械停表测量时间间隔，会正确读数；体验估测时间的方法。',
    apparatus: ['机械停表'],
    steps: ['按复位按钮，使指针归零', '按顶部按钮开始计时，再按一次停止', '先读小表盘的分钟数，判断是否过半格', '再读大表盘的秒数，二者相加', '挑战：不看表估测 1 分钟'],
    widgets: ['stopwatch-practice', 'estimate-minute'],
    think: [['小表盘指针刚过 2 和 3 之间的半格线，大表盘指在 10 s 处，读数是多少？', '指针过了半格线，秒数在 30 s 以上：2 min 40 s，即 160 s。']],
  },
  {
    id: 'reference', ch: 1, icon: '🚄', title: '参照物观察室', sub: '3D 场景：运动和静止的相对性', lesson: '../chapter1/s2-motion.html#k2',
    goal: '通过切换参照物，理解“判断物体运动还是静止，取决于所选的参照物”。',
    apparatus: ['火车', '汽车', '卡车', '飞鸟', '路边的树和小孩'],
    steps: ['以地面为参照物，观察各物体的运动情况', '以火车为参照物，观察窗外景物的运动方向', '把汽车速度调到与火车相同，再以火车为参照物观察汽车', '以卡车、飞鸟为参照物，描述其他物体的运动'],
    widgets: ['reference-3d'],
    think: [['坐在火车上的乘客看到旁边的汽车“不动”，说明了什么？', '汽车与火车运动快慢相同、方向相同，两者相对静止。']],
  },
  {
    id: 'incline', ch: 1, icon: '🛝', title: '测量小车的平均速度', sub: '3D 斜面实验 · 电子计时 / 停表计时', lesson: '../chapter1/s4-average-speed.html',
    goal: '用刻度尺和停表测量小车沿斜面下滑时全程、上半段、下半段的平均速度。',
    apparatus: ['长木板（斜面）', '垫块', '小车', '金属片', '刻度尺', '停表'],
    steps: ['用垫块把木板一端垫高，组成坡度较小的斜面', '金属片放在底端（160 cm），释放小车，测出全程时间 t₁', '金属片移到中点（80 cm），测出上半段时间 t₂', '计算 v₁ = s₁/t₁、v₂ = s₂/t₂、v₃ = (s₁−s₂)/(t₁−t₂)', '比较三个速度，得出结论'],
    widgets: ['incline-3d'],
    think: [['把垫块调到 25 cm 以上，用停表人工计时，会遇到什么困难？', '小车下滑太快，时间很短，人的反应时间带来的误差变得很大，所以斜面坡度要小一些。'], ['为什么不能让小车从中点静止释放来测下半段的时间？', '小车从顶端下滑经过中点时速度不为零，从中点静止释放测得的时间偏长。']],
  },
  {
    id: 'ultrasound', ch: 1, icon: '📡', title: '超声波测速', sub: '回声测距原理 · 计算车速', lesson: '../chapter1/s4-average-speed.html#k4',
    goal: '理解超声波测距的原理 s = v声t/2，会用两次测距的结果计算物体的速度。',
    apparatus: ['超声波测速仪', '行驶的汽车'],
    steps: ['点击“发射超声波”，观察两个脉冲的发射与反射', '读出往返时间 t₁、t₂，算出两次的距离 s₁、s₂', '求汽车在两次遇到超声波之间行驶的路程和时间', '计算车速，判断是否超速'],
    widgets: ['ultrasound'],
    think: [['为什么计算距离时要除以 2？', '测得的时间是超声波“去”和“回”的总时间，单程只占一半。']],
  },
];
var COMING = [
  { ch: 2, icon: '🔊', title: '声音的产生与传播' },
  { ch: 3, icon: '🌡️', title: '探究水沸腾时温度的变化' },
  { ch: 4, icon: '🪞', title: '探究平面镜成像的特点' },
  { ch: 5, icon: '🔍', title: '探究凸透镜成像的规律' },
  { ch: 6, icon: '⚖️', title: '测量物质的密度' },
];
var CH_NAMES = { 1: '第1章 机械运动', 2: '第2章 声现象', 3: '第3章 物态变化', 4: '第4章 光现象', 5: '第5章 透镜及其应用', 6: '第6章 质量与密度' };

(function () {
  var h = PS.h;
  var side = document.getElementById('labSide');
  var main = document.getElementById('labMain');
  var items = {}, panels = {};
  var lastCh = 0;
  EXPERIMENTS.forEach(function (e) {
    if (e.ch !== lastCh) { side.append(h('h3', null, CH_NAMES[e.ch])); lastCh = e.ch; }
    var b = h('button', { type: 'button', class: 'lab-item' }, h('span', { class: 'ico' }, e.icon), h('span', null, h('b', null, e.title), h('small', null, e.sub)));
    b.addEventListener('click', function () { location.hash = e.id; });
    items[e.id] = b;
    side.append(b);
  });
  side.append(h('h3', null, '后续章节（制作中）'));
  COMING.forEach(function (c) {
    side.append(h('div', { class: 'lab-item soon' }, h('span', { class: 'ico' }, c.icon), h('span', null, h('b', null, c.title), h('small', null, CH_NAMES[c.ch] + ' · 即将上线'))));
  });

  function build(e) {
    var wrap = h('div', { class: 'lab-exp' });
    wrap.append(h('div', { class: 'lab-head' },
      h('div', { class: 'big-ico' }, e.icon),
      h('div', null, h('h2', null, e.title), h('p', null, CH_NAMES[e.ch] + ' · ', h('a', { href: e.lesson }, '查看相关课程 →')))));
    var info = h('div', { class: 'lab-info', style: { marginTop: '14px' } },
      h('div', { class: 'card' }, h('h4', null, '🎯 实验目的'), h('p', { style: { margin: 0 } }, e.goal)),
      h('div', { class: 'card' }, h('h4', null, '🧰 实验器材'), h('div', { class: 'apparatus' }, e.apparatus.map(function (a) { return h('span', null, a); }))),
      h('div', { class: 'card' }, h('h4', null, '📋 实验步骤'), h('ol', null, e.steps.map(function (s) { return h('li', null, s); }))));
    wrap.append(info);
    e.widgets.forEach(function (w, i) {
      var bench = h('div', { class: 'lab-bench' });
      if (e.widgets.length > 1) bench.append(h('h3', null, w === 'estimate-minute' ? '挑战：估测 1 分钟' : '实验操作'));
      var box = h('div');
      bench.append(box);
      wrap.append(bench);
      PS.mount(w, box, {});
    });
    if (e.think && e.think.length) {
      var t = h('div', { class: 'lab-think' }, h('h4', null, '🤔 想一想'));
      e.think.forEach(function (q) {
        var d = h('details', { class: 'reveal' }, h('summary', null, q[0]), h('p', { style: { margin: '0 0 6px' } }, q[1]));
        t.append(d);
      });
      wrap.append(t);
    }
    main.append(wrap);
    return wrap;
  }

  function show(id) {
    var e = EXPERIMENTS.filter(function (x) { return x.id === id; })[0] || EXPERIMENTS[4];
    Object.keys(items).forEach(function (k) { items[k].classList.toggle('on', k === e.id); });
    if (!panels[e.id]) panels[e.id] = build(e);
    Object.keys(panels).forEach(function (k) { panels[k].classList.toggle('on', k === e.id); });
    document.title = e.title + ' · 物理实验台';
  }
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  document.addEventListener('DOMContentLoaded', function () { show(location.hash.slice(1)); });
})();
</script>
