  var items = {}, panels = {};

  EXPERIMENTS.forEach(function (e) {
    if (e.ch !== lastCh) { side.append(h('h3', null, CH_NAMES[e.ch])); lastCh = e.ch; }
    var b = h('button', { type: 'button', class: 'lab-item' }, h('span', { class: 'ico' }, e.icon), h('span', null, h('b', null, e.title), h('small', null, e.sub)));
    b.addEventListener('click', function () { location.hash = e.id; });
    items[e.id] = b;
    side.append(b);
  });
  side.append(h('h3', null, '后续章节（制作中）'));
  COMING.forEach(function (c) {
    side.append(h('div', { class: 'lab-item soon' }, h('span', { class: 'ico' }, c.icon), h('span', null, h('b', null, c.title), h('small', null, CH_NAMES[c.ch] + ' · 即将上线'))));
  });

  function build(e) {
    var wrap = h('div', { class: 'lab-exp' });
    wrap.append(h('div', { class: 'lab-head' },
      h('div', { class: 'big-ico' }, e.icon),
      h('div', null, h('h2', null, e.title), h('p', null, CH_NAMES[e.ch] + ' · ', h('a', { href: e.lesson }, '查看相关课程 →')))));
    var info = h('div', { class: 'lab-info', style: { marginTop: '14px' } },
      h('div', { class: 'card' }, h('h4', null, '🎯 实验目的'), h('p', { style: { margin: 0 } }, e.goal)),
      h('div', { class: 'card' }, h('h4', null, '🧰 实验器材'), h('div', { class: 'apparatus' }, e.apparatus.map(function (a) { return h('span', null, a); }))),
      h('div', { class: 'card' }, h('h4', null, '📋 实验步骤'), h('ol', null, e.steps.map(function (s) { return h('li', null, s); }))));
    wrap.append(info);
    e.widgets.forEach(function (w, i) {
      // 组件可以写成 '名字' 或 ['名字', 参数]
      var name = Array.isArray(w) ? w[0] : w, opts = Array.isArray(w) ? w[1] : {};
      var bench = h('div', { class: 'lab-bench' });
      if (e.widgets.length > 1) bench.append(h('h3', null, e.titles ? e.titles[i] : name === 'estimate-minute' ? '挑战：估测 1 分钟' : '实验操作'));
      var box = h('div');
      bench.append(box);
      wrap.append(bench);
      PS.mount(name, box, opts);
    });
    if (e.think && e.think.length) {
      var t = h('div', { class: 'lab-think' }, h('h4', null, '🤔 想一想'));
      e.think.forEach(function (q) {
        var d = h('details', { class: 'reveal' }, h('summary', null, q[0]), h('p', { style: { margin: '0 0 6px' } }, q[1]));
        t.append(d);
      });
      wrap.append(t);
    }
    main.append(wrap);
    return wrap;
  }

  function show(id) {
    var e = EXPERIMENTS.filter(function (x) { return x.id === id; })[0] || EXPERIMENTS[4];
    Object.keys(items).forEach(function (k) { items[k].classList.toggle('on', k === e.id); });
    if (!panels[e.id]) panels[e.id] = build(e);
    Object.keys(panels).forEach(function (k) { panels[k].classList.toggle('on', k === e.id); });
    document.title = e.title + ' · 物理实验台';
  }
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  document.addEventListener('DOMContentLoaded', function () { show(location.hash.slice(1)); });
})();
</script>
</body>
</html>
